<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bjzjwin's GitHub Pages</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 90%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 1.8rem;
            color: #fff;
        }
        p {
            margin: 0 0 24px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .project-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }
        .project-card:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .project-info {
            text-align: left;
        }
        .project-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .project-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .arrow-btn {
            background: var(--accent);
            color: #0f172a;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 欢迎来到 bjzjwin's Pages</h1>
        <p>个人前端小项目与实验作品集展示。</p>

        <a class="project-card" href="t-rex-runner/">
            <div class="project-info">
                <div class="project-title">🦖 Chrome T-Rex Runner</div>
                <div class="project-desc">速度可调增强版 · 逆向自 Chromium 游戏引擎</div>
            </div>
            <div class="arrow-btn">➔</div>
        </a>
    </div>
</body>
</html>
